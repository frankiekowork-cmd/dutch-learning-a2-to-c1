name: Validate Dutch learning frontend
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/personalized-learning-foundation]
permissions:
  contents: read
jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/auth.js
          node --check web/content.js
          node --check web/lesson-catalog.js
          node --check web/curriculum.js
          node --check web/review-questions.js
          node --check web/learning-engine.js
          node --check web/review.js
      - name: Verify referenced HTML IDs exist
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const html=fs.readFileSync('web/index.html','utf8');
          const ids=[...html.matchAll(/\bid="([^"]+)"/g)].map(x=>x[1]);
          const errors=[];
          for(const id of ids) if(ids.indexOf(id)!==ids.lastIndexOf(id)) errors.push('Duplicate id '+id);
          for(const file of ['web/app.js','web/auth.js']){
            const source=fs.readFileSync(file,'utf8');
            for(const match of source.matchAll(/\b(?:el|\$)\("([^"]+)"\)/g)){
              if(!ids.includes(match[1]))errors.push(file+' references missing #'+match[1]);
            }
          }
          if(errors.length){console.error(errors.join('\n'));process.exit(1);}
          console.log('Frontend IDs verified');
          JS

  browser-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        run: |
          npm install --no-save --ignore-scripts @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser tests (mocked auth, never real credentials)
        run: npx playwright test --config=tests/playwright.config.mjs

  preview-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check preview has no server secrets
        run: |
          if grep -rE 'sb_secret_|service_role_key|sk-proj-|OPENAI_API_KEY[[:space:]]*=' web/; then
            echo 'Potential secret found in web'; exit 1
          fi
      - name: Package standalone test site
        run: |
          mkdir -p preview-dist
          cp -R web/. preview-dist/
          cat > preview-dist/README_TESTING.txt <<'TXT'
          Independent local preview of the development branch.
          1. Extract all files.
          2. Run: python3 -m http.server 8765 --directory .
          3. Open: http://localhost:8765/
          4. Add http://localhost:8765/ as an EXACT redirect URL in Supabase Auth settings BEFORE requesting a magic link.
          5. Test guest mode, email login and explicit cloud save with test accounts only.
          DO NOT publish real personal data. OPENAI AI grading is NOT enabled.
          TXT
      - uses: actions/upload-artifact@v4
        with:
          name: dutch-learning-local-preview
          path: preview-dist/
          retention-days: 7
